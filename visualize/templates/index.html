<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONL Viewer - Folders</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Courier Prime", "Courier New", Courier, monospace;
    background: #f5f0e8;
    min-height: 100vh;
    padding: 32px 20px;
    font-size: 14px;
    color: #1a1610;
    letter-spacing: 0.02em;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
}

h1 {
    font-family: "Special Elite", serif;
    color: #1a1610;
    text-align: center;
    margin-bottom: 32px;
    font-size: 1.8em;
    font-weight: 400;
    letter-spacing: 0.06em;
}

h2 {
    font-family: "Special Elite", serif;
    color: #1a1610;
    text-align: center;
    margin-bottom: 32px;
    font-weight: 400;
    letter-spacing: 0.04em;
}

/* ---------- Stats bar ---------- */
.stats-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.stat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    background: transparent;
    border: 1px solid #c8bfaf;
    border-bottom: 2px solid #6b6054;
    font-family: "Courier Prime", monospace;
    font-size: 0.85em;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #1a1610;
    cursor: pointer;
    transition: background 0.12s, transform 0.1s;
    box-shadow: 2px 2px 0px #c8bfaf;
}

.stat-btn:hover {
    background: #e4ddd1;
    transform: translateY(-1px);
}

.stat-btn.active {
    background: #e4ddd1;
    border-bottom-color: #1a1610;
}

.stat-btn .dot {
    width: 10px;
    height: 10px;
    border-radius: 0;
    flex-shrink: 0;
}

.stat-btn.btn-green .dot { background: #2d6a4f; }
.stat-btn.btn-red   .dot { background: #9b2226; }
.stat-btn.btn-none  .dot { background: #6b6054; }
.stat-btn.btn-all   .dot { background: #1a1610; }

.stat-count {
    font-size: 1em;
    color: inherit;
}

/* ---------- Folders grid ---------- */
.folders-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
}

.folder-card {
    background: #ede8df;
    padding: 24px;
    border-radius: 0;
    border: 1px solid #c8bfaf;
    border-bottom: 3px solid #6b6054;
    text-decoration: none;
    color: #1a1610;
    transition: background 0.15s, transform 0.12s, box-shadow 0.12s;
    box-shadow: 2px 2px 0px #c8bfaf;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

.folder-card.green {
    background: #d4e8df;
    border: 1px solid #a8c8bb;
    border-bottom: 3px solid #2d6a4f;
    box-shadow: 2px 2px 0px #a8c8bb;
}

.folder-card:hover {
    background: #e4ddd1;
    transform: translateY(-2px);
    box-shadow: 3px 4px 0px #b8b0a4;
}

.folder-card.green:hover {
    background: #c4ddd2;
    transform: translateY(-2px);
    box-shadow: 3px 4px 0px #8ab8a8;
}

.folder-icon {
    font-size: 2.4em;
    margin-bottom: 8px;
    opacity: 0.8;
}

.folder-name {
    font-size: 0.95em;
    font-weight: 700;
    text-align: center;
    word-break: break-word;
    color: #1a1610;
    letter-spacing: 0.04em;
    font-family: "Courier Prime", "Courier New", Courier, monospace;
}

.no-folders {
    text-align: center;
    color: #6b6054;
    font-size: 0.95em;
    margin-top: 40px;
    font-style: italic;
}

.red {
    background: #edd8d8 !important;
    border: 1px solid #d4a8a8 !important;
    border-bottom: 3px solid #9b2226 !important;
    box-shadow: 2px 2px 0px #d4a8a8 !important;
}

.red:hover {
    background: #e4cccc !important;
}

/* hidden by filter */
.folder-card.hidden {
    display: none;
}

/* ---------- Goal tooltip ---------- */
.goal-tooltip {
    display: none;
    position: fixed;
    z-index: 9999;
    max-width: 340px;
    background: #1a1610;
    color: #f5f0e8;
    font-family: "Courier Prime", monospace;
    font-size: 0.82em;
    line-height: 1.55;
    padding: 12px 16px;
    border: 1px solid #6b6054;
    box-shadow: 4px 4px 0px #6b6054;
    pointer-events: none;
    word-break: break-word;
}

.goal-tooltip.loading::after {
    content: "loading…";
    opacity: 0.5;
    font-style: italic;
}

.goal-tooltip.visible {
    display: block;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Attack Explorer</h1>
        <h2>{{ bfolder }}</h2>

        <div class="stats-bar">
            <button class="stat-btn btn-all active" onclick="filterCards('all')">
                <span class="dot"></span>
                All&nbsp;<span class="stat-count" id="count-all">0</span>
            </button>
            <button class="stat-btn btn-green" onclick="filterCards('green')">
                <span class="dot"></span>
                Successful&nbsp;<span class="stat-count" id="count-green">0</span>
            </button>
            <button class="stat-btn btn-red" onclick="filterCards('red')">
                <span class="dot"></span>
                Unsuccessful (Context cut)&nbsp;<span class="stat-count" id="count-red">0</span>
            </button>
            <button class="stat-btn btn-none" onclick="filterCards('none')">
                <span class="dot"></span>
                Unsuccessful&nbsp;<span class="stat-count" id="count-none">0</span>
            </button>
        </div>

        <div class="folders-grid" id="foldersGrid">
            {% if folders %}
                {% for folder in folders %}
                <a href="/folder/{{ folder[0] }}"
                   class="folder-card {{ 'green' if folder[1] else '' }} {{ 'red' if folder[1]!=false and folder[1]!=true else '' }}"
                   data-folder="{{ folder[0] }}">
                    <div>
                        <div class="folder-name">{{ folder[0] }}</div>
                    </div>
                </a>
                {% endfor %}
            {% else %}
                <div class="no-folders">
                    No folders found in BASE_FOLDER
                </div>
            {% endif %}
        </div>
    </div>

    <!-- Shared floating tooltip -->
    <div class="goal-tooltip" id="goalTooltip"></div>

    <script>
        // ── Stats ────────────────────────────────────────────────────────────
        function updateCounts() {
            const cards = document.querySelectorAll('.folder-card');
            let green = 0, red = 0, none = 0;
            cards.forEach(card => {
                if (card.classList.contains('green')) green++;
                else if (card.classList.contains('red')) red++;
                else none++;
            });
            document.getElementById('count-all').textContent   = cards.length;
            document.getElementById('count-green').textContent = green;
            document.getElementById('count-red').textContent   = red;
            document.getElementById('count-none').textContent  = none;
        }

        function filterCards(type) {
            const cards = document.querySelectorAll('.folder-card');
            cards.forEach(card => {
                if (type === 'all') {
                    card.classList.remove('hidden');
                } else if (type === 'green') {
                    card.classList.toggle('hidden', !card.classList.contains('green'));
                } else if (type === 'red') {
                    card.classList.toggle('hidden', !card.classList.contains('red'));
                } else if (type === 'none') {
                    card.classList.toggle('hidden', card.classList.contains('green') || card.classList.contains('red'));
                }
            });
            document.querySelectorAll('.stat-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // ── Goal tooltip ─────────────────────────────────────────────────────
        const tooltip  = document.getElementById('goalTooltip');
        const cache    = {};          // folder_name → goal text
        let   pending  = null;        // current in-flight fetch AbortController
        let   hoverTimer = null;

        function showTooltip(x, y, text) {
            tooltip.textContent = text;
            tooltip.classList.remove('loading');
            tooltip.classList.add('visible');
            positionTooltip(x, y);
        }

        function positionTooltip(x, y) {
            const pad = 14;
            const tw  = tooltip.offsetWidth  || 340;
            const th  = tooltip.offsetHeight || 80;
            let   left = x + pad;
            let   top  = y + pad;
            if (left + tw > window.innerWidth  - 8) left = x - tw - pad;
            if (top  + th > window.innerHeight - 8) top  = y - th - pad;
            tooltip.style.left = left + 'px';
            tooltip.style.top  = top  + 'px';
        }

        function hideTooltip() {
            tooltip.classList.remove('visible', 'loading');
            tooltip.textContent = '';
            if (pending) { pending.abort(); pending = null; }
            clearTimeout(hoverTimer);
        }

        document.querySelectorAll('.folder-card').forEach(card => {
            const folder = card.dataset.folder;

            card.addEventListener('mouseenter', e => {
                clearTimeout(hoverTimer);
                // Small delay so fast mouse-overs don't spam requests
                hoverTimer = setTimeout(() => {
                    if (cache[folder] !== undefined) {
                        showTooltip(e.clientX, e.clientY, cache[folder]);
                        return;
                    }
                    // Show loading state
                    tooltip.textContent = '';
                    tooltip.classList.add('loading', 'visible');
                    positionTooltip(e.clientX, e.clientY);

                    const ctrl = new AbortController();
                    pending = ctrl;
                    fetch(`/api/goal/${encodeURIComponent(folder)}`, { signal: ctrl.signal })
                        .then(r => r.json())
                        .then(data => {
                            cache[folder] = data.goal || '—';
                            showTooltip(e.clientX, e.clientY, cache[folder]);
                        })
                        .catch(() => {});   // aborted or error — silently ignore
                }, 180);
            });

            card.addEventListener('mousemove', e => {
                if (tooltip.classList.contains('visible')) {
                    positionTooltip(e.clientX, e.clientY);
                }
            });

            card.addEventListener('mouseleave', hideTooltip);
        });

        updateCounts();
    </script>
</body>
</html>
