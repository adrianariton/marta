<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT-2 Chat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0f12;
    --surface: #141720;
    --border: #1e2330;
    --accent: #4ade80;
    --accent-dim: #1a3a25;
    --text: #d4d8e2;
    --text-dim: #5a6070;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:0.3; }
  }
  header h1 {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--border);
    padding: 3px 8px;
    border-radius: 3px;
    margin-left: 4px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 2.2;
  }
  .empty .glyph { font-size: 40px; color: var(--border); display: block; margin-bottom: 12px; }
  .msg {
    display: flex;
    gap: 14px;
    padding: 13px 16px;
    border-radius: 6px;
    max-width: 780px;
    width: 100%;
    animation: fadeUp 0.15s ease;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(4px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .msg.user  { background:#161c2a; align-self:flex-end; flex-direction:row-reverse; }
  .msg.model { background:#111418; border-left:2px solid var(--accent); align-self:flex-start; }
  .msg.error { background:#180f0f; border-left:2px solid #f87171; align-self:flex-start; }
  .role {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-top: 2px;
    flex-shrink: 0;
    width: 30px;
    text-align: center;
  }
  .msg.model .role { color: var(--accent); }
  .msg.error .role { color: #f87171; }
  .content {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
  }
  .msg.error .content { color: #fca5a5; }
  .typing { display:flex; gap:5px; align-items:center; padding:4px 0; }
  .typing span {
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    animation: bounce 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay:.18s; }
  .typing span:nth-child(3) { animation-delay:.36s; }
  @keyframes bounce {
    0%,80%,100% { transform:translateY(0); opacity:0.3; }
    40% { transform:translateY(-6px); opacity:1; }
  }
  footer {
    padding: 14px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: 780px;
  }
  textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    padding: 11px 14px;
    border-radius: 6px;
    resize: none;
    outline: none;
    min-height: 46px;
    max-height: 160px;
    line-height: 1.5;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--text-dim); }
  button {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0 18px;
    height: 46px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  button:hover:not(:disabled) { background:var(--accent); color:#000; }
  button:disabled { opacity:0.35; cursor:not-allowed; }
  .hint {
    margin-top: 7px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Chat</h1>
  <span class="tag">gpt2</span>
  <span class="tag">localhost:8888</span>
</header>

<div id="messages">
  <div class="empty" id="empty">
    <span class="glyph">⬡</span>
    server at localhost:8888<br>
    type a message to begin
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Type a message…" rows="1"></textarea>
    <button id="send">Send</button>
  </div>
  <div class="hint">enter to send · shift+enter for newline</div>
</footer>

<script>
  const API   = "http://localhost:8888";
  const MODEL = "TinyLlama/TinyLlama-1.1B-Chat-v1.0";

  const msgsEl  = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  let history = [];
  let busy    = false;

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
  });

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  sendBtn.addEventListener("click", send);

  function addMsg(role, text) {
    document.getElementById("empty")?.remove();
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    const roleEl = document.createElement("div");
    roleEl.className = "role";
    roleEl.textContent = role === "user" ? "you" : role === "error" ? "err" : "ai";
    const content = document.createElement("div");
    content.className = "content";
    content.textContent = text;
    wrap.appendChild(roleEl);
    wrap.appendChild(content);
    msgsEl.appendChild(wrap);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return content;
  }

  function addTyping() {
    document.getElementById("empty")?.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg model";
    wrap.id = "typing";
    wrap.innerHTML = `<div class="role" style="color:var(--accent)">ai</div><div class="content"><div class="typing"><span></span><span></span><span></span></div></div>`;
    msgsEl.appendChild(wrap);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return wrap;
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = "";
    inputEl.style.height = "auto";

    addMsg("user", text);
    history.push({ role: "user", content: text });

    // Build prompt from conversation history
    const prompt = history.map(m =>
      m.role === "user" ? `User: ${m.content}` : `Assistant: ${m.content}`
    ).join("\n") + "\nAssistant:";

    const typing = addTyping();
    console.log(`Fetching ${API}/api/hf/generate?modelname=${encodeURIComponent(MODEL)}`)
    try {
      const res = await fetch(
        `${API}/api/hf/generate?modelname=${encodeURIComponent(MODEL)}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, max_new_tokens: 200 })
        }
      );

      typing.remove();

      if (!res.ok) {
        const err = await res.text();
        addMsg("error", `HTTP ${res.status}: ${err}`);
      } else {
        const data = await res.json();
        // Strip the echoed prompt — GPT-2 returns the full text
        let reply = data.generated || "";
        console.log(reply)
        const marker = "Assistant:";
        const last = reply.lastIndexOf(marker);
        if (last !== -1) reply = reply.slice(last + marker.length).trim();

        addMsg("model", reply);
        history.push({ role: "assistant", content: reply });
      }
    } catch (e) {
      typing.remove();
      addMsg("error", "Could not reach server.\nIs your SSH tunnel running?\n\nssh -L 8888:<node>:8888 $USER@fep");
    }

    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
