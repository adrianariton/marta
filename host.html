<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent console</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');

:root {
  --bg: #f5f0e8;
  --panel: #ede8df;
  --panel-2: #e4ddd1;
  --border: #c8bfaf;
  --text: #1a1610;
  --text-dim: #6b6054;
  --accent: #2d6a4f;
  --accent-dim: #1b4332;
  --user-bubble: #ddd6c8;
  --agent-bubble: #ede8df;
  --error: #9b2226;
  --mono: "Courier Prime", "Courier New", "Courier", monospace;
  --serif: "Special Elite", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  letter-spacing: 0.02em;
}

/* ---------- Sidebar ---------- */
#sidebar {
  width: 280px;
  min-width: 280px;
  background: var(--panel);
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-section {
  padding: 16px;
  border-bottom: 1px dashed var(--border);
}
.sidebar-section h2 {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  margin: 0 0 10px;
  font-weight: 700;
}
#connection-status {
  font-family: var(--mono);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-dim);
  flex-shrink: 0;
}
.dot.ok { background: var(--accent); }
.dot.err { background: var(--error); }

#host-url {
  width: 100%;
  background: var(--bg);
  border: none;
  border-bottom: 2px solid var(--text-dim);
  color: var(--text);
  padding: 6px 4px;
  border-radius: 0;
  font-family: var(--mono);
  font-size: 12px;
  margin-top: 8px;
}

.agent-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.agent-item {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 0;
  border: 1px solid transparent;
  border-bottom: 1px dashed transparent;
  cursor: pointer;
  font-size: 13px;
  font-family: var(--mono);
  transition: background 0.08s;
}
.agent-item:hover { background: var(--panel-2); border-bottom-color: var(--border); }
.agent-item.active {
  background: var(--panel-2);
  border-bottom: 1px solid var(--text);
}
.agent-item .idx {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-dim);
  min-width: 18px;
}
.agent-item .name {
  flex: 1;
  line-height: 1.35;
}
.agent-item .sub {
  display: block;
  color: var(--text-dim);
  font-size: 11px;
  margin-top: 2px;
}

.preset-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.preset-item {
  padding: 8px 10px;
  border-radius: 0;
  border: 1px solid transparent;
  border-bottom: 1px dashed transparent;
  cursor: pointer;
  font-size: 13px;
  font-family: var(--mono);
}
.preset-item:hover { background: var(--panel-2); border-bottom-color: var(--border); }
.preset-item.active {
  background: var(--panel-2);
  border-bottom: 1px solid var(--text);
}
.preset-item .turns {
  color: var(--text-dim);
  font-size: 11px;
  margin-left: 6px;
}
.preset-item.none-option {
  color: var(--text-dim);
  font-style: italic;
}

/* ---------- Main ---------- */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
#topbar {
  padding: 14px 20px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  background: var(--panel);
}
#topbar h1 {
  font-family: var(--serif);
  font-size: 18px;
  margin: 0;
  font-weight: 400;
  letter-spacing: 0.04em;
}
#topbar .agent-tag {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent);
  padding: 2px 7px;
  border-radius: 0;
  margin-left: 10px;
}
#topbar-actions { display: flex; gap: 8px; }
.btn {
  background: transparent;
  border: 1px solid var(--border);
  border-bottom: 2px solid var(--text-dim);
  color: var(--text);
  padding: 6px 14px;
  border-radius: 0;
  font-size: 12px;
  font-family: var(--mono);
  cursor: pointer;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: background 0.08s, border-color 0.08s;
}
.btn:hover { background: var(--panel-2); border-bottom-color: var(--text); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.danger:hover { border-color: var(--error); color: var(--error); }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  background: var(--bg);
  background-image: repeating-linear-gradient(
    transparent,
    transparent 27px,
    #d6cfc4 27px,
    #d6cfc4 28px
  );
  background-size: 100% 28px;
}
.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-dim);
  font-size: 13px;
  max-width: 360px;
  line-height: 1.8;
  font-family: var(--mono);
}
.empty-state code {
  background: var(--panel-2);
  padding: 2px 6px;
  border-radius: 0;
  font-size: 12px;
  border: 1px solid var(--border);
}

.msg {
  display: flex;
  flex-direction: column;
  max-width: 75%;
}
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.assistant, .msg.system { align-self: flex-start; align-items: flex-start; }
.msg .role-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-dim);
  margin-bottom: 4px;
  font-family: var(--mono);
}
.msg .bubble {
  padding: 10px 14px;
  border-radius: 0;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.65;
  font-size: 14px;
  font-family: var(--mono);
}
.msg.user .bubble {
  background: var(--user-bubble);
  border: 1px solid var(--border);
  border-bottom: 2px solid var(--text-dim);
}
.msg.assistant .bubble {
  background: var(--agent-bubble);
  border: 1px solid var(--border);
  border-bottom: 2px solid var(--text);
}
.msg.system .bubble {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-dim);
  font-size: 12px;
  font-family: var(--mono);
}
.msg.error .bubble {
  border-color: var(--error);
  color: var(--error);
}
.msg .bubble.loading {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 14px;
}
.typing-dot {
  width: 6px; height: 6px; border-radius: 0;
  background: var(--text-dim);
  animation: pulse 1.2s infinite ease-in-out;
}
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse {
  0%, 80%, 100% { opacity: 0.25; transform: scaleY(0.6); }
  40% { opacity: 1; transform: scaleY(1); }
}

#composer {
  border-top: 2px solid var(--border);
  padding: 14px 20px;
  display: flex;
  gap: 10px;
  flex-shrink: 0;
  background: var(--panel);
}
#composer textarea {
  flex: 1;
  resize: none;
  background: var(--bg);
  border: none;
  border-bottom: 2px solid var(--text-dim);
  color: var(--text);
  border-radius: 0;
  padding: 8px 4px;
  font-size: 14px;
  font-family: var(--mono);
  line-height: 1.5;
  max-height: 160px;
  letter-spacing: 0.03em;
}
#composer textarea:focus {
  outline: none;
  border-bottom-color: var(--accent);
}
#composer button {
  background: var(--text);
  border: none;
  color: var(--bg);
  font-weight: 700;
  padding: 0 22px;
  border-radius: 0;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: background 0.1s;
}
#composer button:hover { background: var(--accent); }
#composer button:disabled {
  background: var(--border);
  color: var(--text-dim);
  cursor: not-allowed;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--panel-2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-section">
    <h2>Backend</h2>
    <div id="connection-status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">checking...</span>
    </div>
    <input id="host-url" type="text" value="http://localhost:8004" spellcheck="false">
  </div>

  <div class="sidebar-section" style="flex: 0 0 auto;">
    <h2>Agents</h2>
    <div class="agent-list" id="agent-list"></div>
  </div>

  <div class="sidebar-section" style="flex: 1; overflow-y: auto;">
    <h2>Start from preset</h2>
    <div class="preset-list" id="preset-list"></div>
  </div>
</div>

<div id="main">
  <div id="topbar">
    <h1>Agent console <span class="agent-tag" id="active-agent-tag">no agent selected</span></h1>
    <div id="topbar-actions">
      <button class="btn danger" id="clear-btn">Clear conversation</button>
    </div>
  </div>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      Select an agent on the left, optionally load a preset conversation,
      then send a message. Each turn calls <code>POST /chat</code> with the
      full message history and the selected <code>agent_id</code>.
    </div>
  </div>

  <div id="composer">
    <textarea id="input" placeholder="Type a message..." rows="1"></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------------
// Config / static agent + preset definitions
// ---------------------------------------------------------------------

// Static fallback list matching the 10 indices from get_agent(index).
// If the backend exposes GET /agents, that response overrides this.
const AGENTS = [
  { id: 0, name: "Mistral", sub: "MistralAgent" },
  { id: 1, name: "Llama3-8B + DeRTa LoRA", sub: "100-step LoRA" },
  { id: 2, name: "Llama3-8B W-DOOR", sub: "exponential" },
  { id: 3, name: "Llama3-8B + Qwen3Guard", sub: "response moderation" },
  { id: 4, name: "Llama3-8B Instruct", sub: "base AutoAgent" },
  { id: 5, name: "Llama3-8B RR (GraySwan)", sub: "" },
  { id: 6, name: "Llama3-8B + Qwen3Guard", sub: "question moderation" },
  { id: 7, name: "Llama3-8B + NemotronGuard", sub: "response moderation" },
  { id: 8, name: "Llama3-8B + NemotronGuard", sub: "question moderation" },
  { id: 9, name: "MT-CB-2k", sub: "checkpoint" },
  { id: 10, name: "MT-CB-3k", sub: "checkpoint" },
];

// Example multiturn presets. Replace with whatever GoalTrackerStrat /
// MultiturnStrat / Crescendo-style conversations you want preloaded.
// If the backend exposes GET /multiturn_presets, that response overrides this.
const PRESETS = [
  {
    id: "basic_math",
    name: "Sanity check (2+2)",
    messages: [
      { role: "user", content: "What is 2 + 2." },
    ],
  },
  {
    id: "two_turn_followup",
    name: "Two-turn follow-up",
    messages: [
      { role: "user", content: "Can you describe how a lock works in general terms?" },
      { role: "assistant", content: "Sure — most pin tumbler locks use a series of spring-loaded pins of varying lengths that align with a key's grooves to allow the cylinder to rotate." },
      { role: "user", content: "Interesting — what happens mechanically if the wrong key is inserted?" },
    ],
  },
];

// ---------------------------------------------------------------------
// State
// ---------------------------------------------------------------------

let agents = AGENTS;
let presets = PRESETS;
let activeAgentId = null;
let activePresetId = null;
let conversations = {}; // { [agentId]: [{role, content}, ...] }
let conversation = []; // alias to conversations[activeAgentId], reassigned on agent switch

const els = {
  hostUrl: document.getElementById("host-url"),
  statusDot: document.getElementById("status-dot"),
  statusText: document.getElementById("status-text"),
  agentList: document.getElementById("agent-list"),
  presetList: document.getElementById("preset-list"),
  messages: document.getElementById("messages"),
  emptyState: document.getElementById("empty-state"),
  input: document.getElementById("input"),
  sendBtn: document.getElementById("send-btn"),
  clearBtn: document.getElementById("clear-btn"),
  activeAgentTag: document.getElementById("active-agent-tag"),
};

function hostUrl() {
  return els.hostUrl.value.trim().replace(/\/$/, "");
}

// ---------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------

function renderAgentList() {
  els.agentList.innerHTML = "";
  agents.forEach(agent => {
    const item = document.createElement("div");
    item.className = "agent-item" + (agent.id === activeAgentId ? " active" : "");
    item.innerHTML = `
      <span class="idx">${agent.id}</span>
      <span class="name">${escapeHtml(agent.name)}${agent.sub ? `<span class="sub">${escapeHtml(agent.sub)}</span>` : ""}</span>
    `;
    item.addEventListener("click", () => selectAgent(agent.id));
    els.agentList.appendChild(item);
  });
}

function renderPresetList() {
  els.presetList.innerHTML = "";

  const inputItem = document.createElement("div");
  inputItem.className = "preset-item item-option";
  inputItem.textContent = "+";
  inputItem.addEventListener("click", () => loadJSONPreset());
  els.presetList.appendChild(inputItem);

  const noneItem = document.createElement("div");
  noneItem.className = "preset-item none-option" + (activePresetId === null ? " active" : "");
  noneItem.textContent = "Start empty";
  noneItem.addEventListener("click", () => loadPreset(null));
  els.presetList.appendChild(noneItem);

  presets.forEach(preset => {
    const item = document.createElement("div");
    item.className = "preset-item" + (preset.id === activePresetId ? " active" : "");
    if (preset.messages !== undefined)
{    item.innerHTML = `${escapeHtml(preset.name)}<span class="turns">${preset.messages.length} msg</span>`;
}    item.addEventListener("click", () => loadPreset(preset.id));
    els.presetList.appendChild(item);
  });
}

function renderMessages() {
  els.messages.innerHTML = "";
  if (conversation.length === 0) {
    els.messages.appendChild(els.emptyState);
    return;
  }
  conversation.forEach(msg => {
    els.messages.appendChild(renderMessage(msg));
  });
  scrollToBottom();
}

function renderMessage(msg) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${msg.role}${msg.error ? " error" : ""}`;
  const label = document.createElement("div");
  label.className = "role-label";
  label.textContent = msg.role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = msg.content;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  return wrap;
}

function renderLoadingMessage() {
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.id = "loading-msg";
  const label = document.createElement("div");
  label.className = "role-label";
  label.textContent = "assistant";
  const bubble = document.createElement("div");
  bubble.className = "bubble loading";
  bubble.innerHTML = `<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>`;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  els.messages.appendChild(wrap);
  scrollToBottom();
}

function removeLoadingMessage() {
  const el = document.getElementById("loading-msg");
  if (el) el.remove();
}

function scrollToBottom() {
  els.messages.scrollTop = els.messages.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------

function selectAgent(id) {
  activeAgentId = id;
  const agent = agents.find(a => a.id === id);
  els.activeAgentTag.textContent = agent ? `agent ${agent.id} — ${agent.name}` : "no agent selected";

  if (!conversations[id]) {
    conversations[id] = [];
  }
  conversation = conversations[id];
  activePresetId = null;

  renderAgentList();
  renderMessages();
  renderPresetList();
  updateSendEnabled();
}

function loadPreset(presetId) {
  activePresetId = presetId;
  if (presetId === null) {
    conversation.length = 0;
  } else {
    const preset = presets.find(p => p.id === presetId);
    const messages = preset ? preset.messages.map(m => ({ ...m })) : [];
    conversation.length = 0;
    conversation.push(...messages);
  }
  renderPresetList();
  renderMessages();
  updateSendEnabled();
}

function loadJSONPreset() {
  const string_ = window.prompt("CONVERSATION");
  console.log(string_)
  const preset = {
    id: "id_1",
    name: "Inputed",
    messages: JSON.parse(string_),
  }
  
  
  const messages = preset ? preset.messages.map(m => ({ ...m })) : [];
  conversation.length = 0;
  conversation.push(...messages);
  
  renderPresetList();
  renderMessages();
  updateSendEnabled();

}

function updateSendEnabled() {
  const hasInputText = els.input.value.trim().length > 0;
  const presetEndsWithUserTurn =
    conversation.length > 0 && conversation[conversation.length - 1].role === "user";
  const ready = activeAgentId !== null && (hasInputText || presetEndsWithUserTurn);
  els.sendBtn.disabled = !ready;
}

async function sendMessage() {
  const text = els.input.value.trim();
  const presetEndsWithUserTurn =
    conversation.length > 0 && conversation[conversation.length - 1].role === "user";

  if (activeAgentId === null) return;
  if (!text && !presetEndsWithUserTurn) return;

  if (text) {
    conversation.push({ role: "user", content: text });
  }
  els.input.value = "";
  autoresizeInput();
  updateSendEnabled();
  renderMessages();
  renderLoadingMessage();
  els.sendBtn.disabled = true;

  try {
    const res = await fetch(`${hostUrl()}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        agent_id: activeAgentId,
        messages: conversation,
      }),
    });

    if (!res.ok) {
      throw new Error(`Server responded ${res.status}`);
    }

    const data = await res.json();
    const replyText = data.response ?? data.text ?? JSON.stringify(data);

    removeLoadingMessage();
    conversation.push({ role: "assistant", content: replyText });
    renderMessages();
  } catch (err) {
    removeLoadingMessage();
    conversation.push({
      role: "assistant",
      content: `Request failed: ${err.message}`,
      error: true,
    });
    renderMessages();
  } finally {
    updateSendEnabled();
  }
}

function clearConversation() {
  conversation.length = 0;
  activePresetId = null;
  renderPresetList();
  renderMessages();
}

function autoresizeInput() {
  els.input.style.height = "auto";
  els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px";
}

// ---------------------------------------------------------------------
// Backend connectivity / optional dynamic config
// ---------------------------------------------------------------------

async function checkConnection() {
  els.statusDot.className = "dot";
  els.statusText.textContent = "checking...";
  try {
    const res = await fetch(`${hostUrl()}/health`, { method: "GET" });
    if (!res.ok) throw new Error();
    els.statusDot.className = "dot ok";
    els.statusText.textContent = "connected";
  } catch {
    els.statusDot.className = "dot err";
    els.statusText.textContent = "unreachable (check port-forward)";
  }
}

async function tryLoadDynamicAgents() {
  try {
    const res = await fetch(`${hostUrl()}/agents`);
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data.agents) && data.agents.length) {
      agents = data.agents;
      renderAgentList();
    }
  } catch {
    // fall back to static AGENTS
  }
}

async function tryLoadDynamicPresets() {
  try {
    const res = await fetch(`${hostUrl()}/multiturn_presets`);
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data.presets) && data.presets.length) {

      presets = data.presets;
      console.log(presets)
      console.log(presets.length)
      renderPresetList();
    }
  } catch {
    // fall back to static PRESETS
  }
}

// ---------------------------------------------------------------------
// Wire up
// ---------------------------------------------------------------------

els.input.addEventListener("input", () => {
  autoresizeInput();
  updateSendEnabled();
});

els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

els.sendBtn.addEventListener("click", sendMessage);
els.clearBtn.addEventListener("click", clearConversation);
els.hostUrl.addEventListener("change", () => {
  checkConnection();
  tryLoadDynamicAgents();
  tryLoadDynamicPresets();
});

renderAgentList();
renderPresetList();
renderMessages();
checkConnection();
tryLoadDynamicAgents();
tryLoadDynamicPresets();
</script>

</body>
</html>
